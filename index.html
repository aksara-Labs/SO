<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stock Scan - No Faktur</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5; --primary-d: #3730a3; --success: #059669; --danger: #e11d48; --warning: #d97706;
      --bg: #f4f6fb; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e5e9f2;
      --shadow: 0 1px 2px rgba(15,23,42,.05), 0 6px 20px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 92px; }
    .header { background: linear-gradient(135deg, #312e81, #4f46e5 70%, #6366f1); color: #fff; padding: 16px 18px 18px; position: sticky; top: 0; z-index: 100; border-radius: 0 0 20px 20px; box-shadow: 0 8px 24px rgba(49,46,129,.28); }
    .header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
    .header h1 svg { width: 22px; height: 22px; padding: 4px; background: rgba(255,255,255,.18); border-radius: 7px; }
    .header .sub { font-size: .76rem; opacity: .82; margin-top: 4px; }
    .container { max-width: 640px; margin: 0 auto; padding: 14px; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: var(--card); border-radius: 14px; padding: 12px 4px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .stat .num { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
    .stat .label { font-size: .64rem; color: var(--muted); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .stat.total .num { color: var(--primary); } .stat.marked .num { color: var(--success); }
    .stat.unmarked .num { color: var(--warning); } .stat.turun .num { color: var(--danger); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; border: none; font-size: .9rem; font-weight: 700; cursor: pointer; transition: transform .12s, box-shadow .12s; font-family: inherit; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.3); }
    .btn-success { background: linear-gradient(135deg, #059669, #10b981); color: #fff; box-shadow: 0 4px 14px rgba(5,150,105,.3); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-block { width: 100%; } .btn-sm { padding: 9px 13px; font-size: .8rem; border-radius: 10px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    #camWrap { position: relative; width: 100%; max-width: 420px; aspect-ratio: 4/3; margin: 0 auto 12px; border-radius: 18px; overflow: hidden; background: #0b1020; box-shadow: var(--shadow); }
    #cam { width: 100%; height: 100%; object-fit: cover; display: block; }
    .aim { position: absolute; inset: 20% 9%; border: 2px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(8,12,28,.32); pointer-events: none; }
    #camFlash { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .3s; }
    #camFlash.show { opacity: .55; transition: none; }
    .cam-status { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; font-size: .8rem; font-weight: 700; text-align: center; color: #fff; background: rgba(15,23,42,.72); backdrop-filter: blur(6px); border-radius: 10px; }
    .cam-status.ok { background: rgba(5,150,105,.94); } .cam-status.warn { background: rgba(217,119,6,.95); } .cam-status.err { background: rgba(225,29,72,.95); }
    .torch { position: absolute; top: 10px; right: 10px; z-index: 5; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.15rem; background: rgba(15,23,42,.6); color: #fff; backdrop-filter: blur(6px); }

    #scanLog { margin-top: 12px; }
    .log-row { display: flex; justify-content: space-between; gap: 8px; font-size: .74rem; padding: 7px 10px; border-radius: 9px; margin-bottom: 4px; background: #f8fafc; color: var(--muted); }
    .log-row span:first-child { font-family: ui-monospace, Menlo, monospace; color: var(--text); font-weight: 600; }
    .log-row.turun, .log-row.nf, .log-row.err { background: #fff1f2; } .log-row.turun span, .log-row.nf span, .log-row.err span { color: var(--danger); font-weight: 700; }
    .log-row.dup { background: #fffbeb; }

    .manual-input { display: flex; gap: 8px; margin-top: 12px; }
    .manual-input input, .search-box, .config-box input { flex: 1; width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: .95rem; outline: none; background: #f8fafc; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
    .manual-input input:focus, .search-box:focus, .config-box input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(79,70,229,.12); }
    .search-box { margin-bottom: 12px; }

    /* kode GE / GB / GG */
    .k-GE { --kc: #2563eb; --kb: #dbeafe; } .k-GB { --kc: #7c3aed; --kb: #ede9fe; } .k-GG { --kc: #0d9488; --kb: #ccfbf1; }
    .tag { display: inline-block; font-size: .68rem; font-weight: 800; padding: 2px 8px; border-radius: 7px; letter-spacing: .05em; background: var(--kb, #e2e8f0); color: var(--kc, #475569); }
    .kode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .kcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; box-shadow: var(--shadow); }
    .kcard .kh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .kcard b { font-size: 1.05rem; font-weight: 800; } .kcard small { font-size: .7rem; color: var(--muted); font-weight: 600; }
    .bar { height: 6px; border-radius: 6px; background: #eef1f7; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--kc, var(--primary)); border-radius: 6px; transition: width .4s; }

    .filter-tabs, .kode-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .filter-tab, .kt { padding: 7px 13px; border-radius: 999px; font-size: .78rem; font-weight: 600; border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; }
    .filter-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .filter-tab.danger.active { background: var(--danger); border-color: var(--danger); }
    .kt small { opacity: .7; margin-left: 3px; } .kt.active { background: var(--kc, var(--text)); color: #fff; border-color: var(--kc, var(--text)); }
    .count { font-size: .72rem; color: var(--muted); padding: 2px 4px 8px; font-weight: 600; }

    .item-list { max-height: 58vh; overflow-y: auto; }
    .item { display: flex; align-items: flex-start; gap: 11px; padding: 11px 12px; margin-bottom: 7px; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--kc, #cbd5e1); border-radius: 12px; }
    .item.marked { background: #f0fdf7; }
    .item.wajib { background: #fff1f2; border-left-color: var(--danger); }
    .item .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d5dbe8; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; }
    .item.marked .check { background: var(--success); border-color: var(--success); color: #fff; }
    .item .info { flex: 1; min-width: 0; }
    .item .top { display: flex; align-items: center; gap: 7px; }
    .item .nf { font-family: ui-monospace, Menlo, monospace; font-size: .82rem; font-weight: 700; color: var(--text); }
    .item .name { font-weight: 600; font-size: .85rem; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .meta { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .item .badge-turun { margin-left: auto; background: var(--danger); color: #fff; font-size: .62rem; padding: 2px 7px; border-radius: 6px; font-weight: 800; letter-spacing: .05em; }

    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: .88rem; font-weight: 600; z-index: 300; opacity: 0; transition: all .3s; max-width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: var(--success); } .toast.error { background: var(--danger); } .toast.warning { background: var(--warning); }

    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: flex; z-index: 100; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
    .nav-item { flex: 1; padding: 8px 4px; text-align: center; font-size: .7rem; font-weight: 600; color: var(--muted); cursor: pointer; border: none; background: none; border-radius: 12px; font-family: inherit; }
    .nav-item svg { width: 22px; height: 22px; display: block; margin: 0 auto 3px; }
    .nav-item.active { color: var(--primary); background: #eef0ff; }

    .hidden { display: none !important; } .page { display: none; } .page.active { display: block; }

    .result-box { padding: 16px; border-radius: 14px; margin-top: 12px; text-align: center; border: 1px solid; }
    .result-box.success { background: #ecfdf5; border-color: #a7f3d0; } .result-box.error { background: #fff1f2; border-color: #fecdd3; } .result-box.warning { background: #fffbeb; border-color: #fde68a; }
    .result-box .title { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; }
    .result-box.error .title { color: var(--danger); } .result-box.success .title { color: var(--success); }
    .result-box .detail { font-size: .82rem; color: var(--muted); margin-top: 3px; }

    .config-box { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; font-size: .85rem; box-shadow: var(--shadow); }
    .config-box input { margin-top: 8px; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #cbd5e1; }
    .status-dot.ok { background: var(--success); } .status-dot.err { background: var(--danger); }
    .sync-status { text-align: center; font-size: .78rem; color: var(--muted); margin: 8px 0 0; min-height: 1.1em; }
    .sync-status.err { color: var(--danger); font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>Stock Scan</h1>
    <div class="sub" id="headerSub">Hubungkan ke backend dulu</div>
  </div>

  <div class="container">
    <div id="page-home" class="page active">
      <div class="config-box" id="configBox">
        <strong>URL Backend (Apps Script)</strong>
        <input type="text" id="backendUrl" placeholder="https://script.google.com/macros/s/XXXX/exec" />
        <div style="margin-top:8px; display:flex; gap:8px;">
          <button class="btn btn-primary btn-sm" onclick="saveBackendUrl()">Simpan & Cek</button>
          <span id="connStatus" style="font-size:0.8rem; align-self:center;"></span>
        </div>
      </div>

      <div id="statsSection" class="hidden">
        <div class="stats">
          <div class="stat total">
            <div class="num" id="statTotal">0</div>
            <div class="label">Total</div>
          </div>
          <div class="stat marked">
            <div class="num" id="statMarked">0</div>
            <div class="label">Marked</div>
          </div>
          <div class="stat unmarked">
            <div class="num" id="statUnmarked">0</div>
            <div class="label">Belum</div>
          </div>
          <div class="stat turun">
            <div class="num" id="statTurun">0</div>
            <div class="label">Wajib Turun</div>
          </div>
        </div>

        <div class="kode-grid" id="kodeStats"></div>

        <div class="card">
          <button class="btn btn-success btn-block" onclick="showPage('scan')">Mulai Scan</button>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn btn-outline btn-sm" id="btnRefresh" onclick="loadData()">Refresh</button>
            <button class="btn btn-outline btn-sm" onclick="resetMarks()">Reset Mark</button>
          </div>
        </div>
      </div>
    </div>

    <div id="page-scan" class="page">
      <div class="card">
        <div id="camWrap"><video id="cam" playsinline muted autoplay></video><div class="aim"></div><div id="camFlash"></div><button id="btnTorch" class="torch hidden" onclick="toggleTorch()">🔦</button><div id="camStatus" class="cam-status">Kamera belum aktif</div></div>
        <button class="btn btn-primary btn-block" id="btnStartScan" onclick="toggleScan()">Mulai Kamera</button>
        <div class="sync-status" id="syncStatus" onclick="retryFailed()"></div>
        <div class="manual-input">
          <input type="text" id="manualBarcode" placeholder="Ketik / scan No Faktur..." inputmode="numeric" />
          <button class="btn btn-primary" onclick="doScan(document.getElementById('manualBarcode').value)">Cari</button>
        </div>
        <div id="scanResult"></div>
        <div id="scanLog"></div>
      </div>
    </div>

    <div id="page-list" class="page">
      <div class="card">
        <input type="text" class="search-box" id="searchInput" placeholder="Cari No Faktur / nama..." oninput="renderList()" />
        <div class="kode-tabs">
          <div class="kt active" data-kode="all" onclick="setKode('all')">Semua</div>
          <div class="kt k-GE" data-kode="GE" onclick="setKode('GE')">GE<small id="cnt-GE"></small></div>
          <div class="kt k-GB" data-kode="GB" onclick="setKode('GB')">GB<small id="cnt-GB"></small></div>
          <div class="kt k-GG" data-kode="GG" onclick="setKode('GG')">GG<small id="cnt-GG"></small></div>
        </div>
        <div class="filter-tabs">
          <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">Semua</div>
          <div class="filter-tab" data-filter="unmarked" onclick="setFilter('unmarked')">Belum</div>
          <div class="filter-tab" data-filter="marked" onclick="setFilter('marked')">Marked</div>
          <div class="filter-tab danger" data-filter="turun" onclick="setFilter('turun')">Wajib Turun</div>
        </div>
        <div class="item-list" id="itemList"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-item active" data-page="home" onclick="showPage('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home
    </button>
    <button class="nav-item" data-page="scan" onclick="showPage('scan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/></svg>Scan
    </button>
    <button class="nav-item" data-page="list" onclick="showPage('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>List
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let BACKEND_URL = localStorage.getItem('stockScan_backend') || '';
    let items = [];
    let currentFilter = 'all';
    let currentKode = 'all';
    const KODES = ['GE', 'GB', 'GG'];
    let stream = null, videoEl = null, detector = null, zxReader = null, zxHard = null, zxCanvas = null, zxN = 0, loopGen = 0, torchOn = false;
    let isScanning = false, camBusy = false, loopTimer = null;
    let lastScanned = '', lastScanTime = 0, lastDecodeAt = 0;
    let camHoldUntil = 0, camStatusKey = '';
    const scanLogs = [];
    const IDLE_OK = 'Arahkan ke barcode / QR';
    const IDLE_WARN = '⚠ Belum terbaca — dekatkan, tahan stabil, cukup cahaya';

    // Watchdog: kamera mati/pause -> hidupkan lagi otomatis
    setInterval(() => {
      if (!isScanning || !stream) return;
      const tr = stream.getVideoTracks()[0];
      if (!tr || tr.readyState === 'ended') { stopScan().then(startScan); return; }
      if (videoEl && videoEl.paused) videoEl.play().catch(() => {});
    }, 2000);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (!document.getElementById('page-scan').classList.contains('active')) return;
      setTimeout(() => { if (!isScanning) startScan(); else keepCameraAlive(); }, 300);
    });

    // Sentuhan pertama: aktifkan suara (browser blok audio sebelum ada sentuhan)
    document.addEventListener('pointerdown', () => { getCtx(); warmSpeech(); }, { once: true });

    document.addEventListener('DOMContentLoaded', () => {
      if (BACKEND_URL) {
        document.getElementById('backendUrl').value = BACKEND_URL;
        checkConnection();
        showPage('scan');   // langsung buka kamera, bukan daftar item
      }
      document.getElementById('manualBarcode').addEventListener('keydown', e => {
        if (e.key === 'Enter') doScan(e.target.value);
      });
    });

    function saveBackendUrl() {
      const url = document.getElementById('backendUrl').value.trim();
      if (!url) {
        toast('URL masih kosong', 'error');
        return;
      }
      BACKEND_URL = url;
      localStorage.setItem('stockScan_backend', url);
      checkConnection();
    }

    async function api(action, params = {}) {
      if (!BACKEND_URL) throw new Error('Backend URL belum diisi');
      const qs = new URLSearchParams({ action, ...params }).toString();
      const res = await fetch(BACKEND_URL + '?' + qs, { method: 'GET' });
      if (!res.ok) throw new Error('Network error ' + res.status);
      return res.json();
    }

    async function checkConnection() {
      const status = document.getElementById('connStatus');
      status.innerHTML = '<span class="status-dot"></span>Mengecek...';
      try {
        const data = await api('ping');
        if (data.ok) {
          status.innerHTML = '<span class="status-dot ok"></span>Terhubung' + ((data.version || 0) < 3 ? ' — ⚠ backend LAMA' : '');
          if ((data.version || 0) < 3) toast('⚠ Backend masih versi lama. Paste Code.gs baru lalu Deploy → New version', 'warning');
          document.getElementById('headerSub').textContent = 'Backend siap';
          loadData();
        } else {
          status.innerHTML = '<span class="status-dot err"></span>Gagal';
        }
      } catch (e) {
        status.innerHTML = '<span class="status-dot err"></span>Error';
        toast('Gagal konek backend: ' + e.message, 'error');
      }
    }

    async function loadData() {
      const btnRefresh = document.getElementById('btnRefresh');
      const originalText = btnRefresh ? btnRefresh.innerHTML : '🔄 Refresh';

      try {
        toast('Sedang memuat data...', '');
        if (btnRefresh) {
          btnRefresh.disabled = true;
          btnRefresh.innerHTML = '⏳ Memuat...';
        }
        document.getElementById('headerSub').textContent = 'Memuat data...';

        const data = await api('getall');
        if (!data.ok) throw new Error(data.error || 'Gagal load');

        items = data.items || [];
        buildIndex();
        reapplyPendingMarks();
        updateStats(data);
        document.getElementById('statsSection').classList.remove('hidden');
        document.getElementById('headerSub').textContent = items.length + ' barang • Sinkron';
        renderList();
        toast('Data berhasil dimuat (' + items.length + ')', 'success');
      } catch (e) {
        toast('Gagal load data: ' + e.message, 'error');
        document.getElementById('headerSub').textContent = 'Gagal memuat data';
      } finally {
        if (btnRefresh) {
          btnRefresh.disabled = false;
          btnRefresh.innerHTML = originalText;
        }
      }
    }

    function setKode(k) {
      currentKode = k;
      document.querySelectorAll('.kt').forEach(t => t.classList.toggle('active', t.dataset.kode === k));
      renderList();
    }

    function renderKodeStats() {
      const box = document.getElementById('kodeStats');
      if (!box) return;
      box.innerHTML = KODES.map(k => {
        const a = items.filter(i => i.kode === k);
        const m = a.filter(i => i.mark === 1).length;
        const p = a.length ? Math.round(m * 100 / a.length) : 0;
        return `<div class="kcard k-${k}"><div class="kh"><span class="tag">${k}</span><b>${m}<small>/${a.length}</small></b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
      }).join('');
      KODES.forEach(k => {
        const el = document.getElementById('cnt-' + k);
        if (el) el.textContent = items.filter(i => i.kode === k).length;
      });
    }

    function updateStats(data) {
      document.getElementById('statTotal').textContent = data.total || items.length;
      document.getElementById('statMarked').textContent = data.marked || items.filter(i => i.mark === 1).length;
      document.getElementById('statUnmarked').textContent = (data.total || items.length) - (data.marked || 0);
      document.getElementById('statTurun').textContent = data.wajibTurunCount || items.filter(i => i.wajibTurun).length;
      renderKodeStats();
    }

    // Bersihkan hasil scan (hapus bintang * dan karakter non-digit)
    function cleanBarcode(code) {
      return String(code || '')
        .trim()
        .replace(/\*/g, '')          // hapus bintang Code 39
        .replace(/[^0-9A-Za-z]/g, ''); // sisakan huruf & angka saja
    }

    // ===== Index lokal: lookup instan tanpa nunggu server =====
    let itemIndex = new Map();
    function buildIndex() {
      itemIndex = new Map();
      items.forEach(i => itemIndex.set(cleanBarcode(i.noFaktur).toUpperCase(), i));
    }

    // ===== Antrian sinkron ke server (di belakang layar) =====
    const syncQueue = [];
    let failedJobs = [];
    let lastSyncErr = '', legacyBackend = false;
    let syncing = false;
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function updateSyncStatus() {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      if (failedJobs.length) {
        el.className = 'sync-status err';
        el.textContent = '⚠ ' + failedJobs.length + ' gagal sinkron (' + (lastSyncErr || 'cek koneksi') + ') — tap untuk coba lagi';
      } else if (syncQueue.length) {
        el.className = 'sync-status';
        el.textContent = '⏳ Menyimpan ' + syncQueue.length + '...';
      } else {
        el.className = 'sync-status';
        el.textContent = '';
      }
    }

    function reapplyPendingMarks() {
      // data baru dari server belum tentu memuat scan yang masih antri
      syncQueue.concat(failedJobs).forEach(j => {
        const it = itemIndex.get(j.code.toUpperCase());
        if (it) it.mark = 1;
      });
    }

    function queueSync(code) {
      syncQueue.push({ code, tries: 0 });
      updateSyncStatus();
      processSync();
    }

    async function processSync() {
      if (syncing) return;
      syncing = true;
      while (syncQueue.length) {
        const batch = syncQueue.splice(0, 25);   // kirim banyak sekaligus = jauh lebih cepat
        try {
          let data;
          if (legacyBackend) {
            // backend lama belum punya markbatch -> kirim satu-satu
            const rs = await Promise.all(batch.map(async j => {
              const r = await api('scan', { nf: j.code });
              return { nf: j.code, found: !!r.found, wajibTurun: !!r.wajibTurun };
            }));
            data = { ok: true, results: rs };
          } else {
            data = await api('markbatch', { nf: batch.map(j => j.code).join(',') });
            if (!data.ok && /tidak dikenal/i.test(data.error || '')) {
              legacyBackend = true;
              syncQueue.unshift(...batch);
              continue;
            }
          }
          if (!data.ok) throw new Error(data.error || 'gagal');
          (data.results || []).forEach(r => {
            const it = itemIndex.get(cleanBarcode(r.nf).toUpperCase());
            if (!r.found) {
              if (it) it.mark = 0;
              toast('Server tidak menemukan ' + r.nf, 'error');
            } else if (r.wajibTurun && it && !it.wajibTurun) {
              it.wajibTurun = true;
              playTurunSound();
              renderResult(it, false);
              refreshStats();
            }
          });
        } catch (e) {
          lastSyncErr = e.message || 'error';
          const back = [];
          batch.forEach(j => { j.tries++; (j.tries >= 5 ? failedJobs : back).push(j); });
          syncQueue.unshift(...back);
          await sleep(1200);
        }
        updateSyncStatus();
      }
      syncing = false;
      updateSyncStatus();
    }

    function retryFailed() {
      if (!failedJobs.length) return;
      failedJobs.forEach(j => { j.tries = 0; syncQueue.push(j); });
      failedJobs = [];
      updateSyncStatus();
      processSync();
    }

    function refreshStats() {
      updateStats({
        total: items.length,
        marked: items.filter(i => i.mark === 1).length,
        wajibTurunCount: items.filter(i => i.wajibTurun).length
      });
    }

    function renderResult(d, alreadyMarked) {
      const resultEl = document.getElementById('scanResult');
      const name = [d.jenis, d.merk, d.tipe].filter(Boolean).join(' • ') || 'Barang';
      const tag = d.kode ? `<span class="tag k-${esc(d.kode)}">${esc(d.kode)}</span> ` : '';
      const nf = `<div class="detail">${tag}NF: <b>${esc(d.noFaktur)}</b></div>`;
      if (d.wajibTurun) {
        resultEl.innerHTML = `
          <div class="result-box error">
            <div class="title">⬇ WAJIB TURUN</div>
            <div class="detail" style="font-weight:700;color:var(--text);margin-top:6px">${esc(name)}</div>
            ${nf}
            ${d.imei ? `<div class="detail">IMEI: ${esc(d.imei)}</div>` : ''}
            ${d.noPolisi ? `<div class="detail">Polisi: ${esc(d.noPolisi)}</div>` : ''}
          </div>`;
      } else {
        resultEl.innerHTML = `
          <div class="result-box ${alreadyMarked ? 'warning' : 'success'}">
            <div class="title">${alreadyMarked ? 'Sudah di-Mark' : 'Berhasil di-Mark'}</div>
            <div class="detail" style="font-weight:700;color:var(--text);margin-top:6px">${esc(name)}</div>
            ${nf}
          </div>`;
      }
    }

    function afterScanUi() {
      const input = document.getElementById('manualBarcode');
      input.value = '';
      if (!isScanning) input.focus();   // jangan buka keyboard saat kamera aktif
    }

    function addLog(code, type, label) {
      scanLogs.unshift({ code, type, label, t: new Date().toLocaleTimeString('id-ID') });
      if (scanLogs.length > 8) scanLogs.length = 8;
      const icon = { ok: '✅', dup: '🔁', turun: '⬇️', nf: '❌', err: '⚠️' };
      document.getElementById('scanLog').innerHTML = scanLogs.map(l =>
        `<div class="log-row ${l.type}"><span>${icon[l.type] || ''} ${esc(l.code)}</span><span>${esc(l.label)} · ${esc(l.t)}</span></div>`).join('');
    }

    function setCamStatus(text, type, holdMs) {
      const el = document.getElementById('camStatus');
      if (!el) return;
      el.textContent = text;
      el.className = 'cam-status ' + (type || '');
      camStatusKey = text;
      camHoldUntil = holdMs ? Date.now() + holdMs : 0;
    }

    function idleStatus() {
      if (Date.now() < camHoldUntil) return;
      if (Date.now() - lastDecodeAt > 3000) { if (camStatusKey !== IDLE_WARN) setCamStatus(IDLE_WARN, 'warn'); }
      else if (camStatusKey !== IDLE_OK) setCamStatus(IDLE_OK, '');
    }

    function flash(color, ms) {
      const f = document.getElementById('camFlash');
      f.style.background = color;
      f.classList.add('show');
      clearTimeout(f._t);
      f._t = setTimeout(() => f.classList.remove('show'), ms);
    }

    // Satu pintu untuk semua bunyi + tanda: "tit" langsung, WAJIB TURUN = "tit" + suara "Turun"
    function signalScan(type) {
      if (type === 'turun') {
        beepScan(1); playTurunSound();
        flash('#dc2626', 900); setCamStatus('⬇️ WAJIB TURUN!', 'err', 2000);
      } else if (type === 'dup') {
        beepScan(2); flash('#d97706', 300); setCamStatus('🔁 Sudah di-mark', 'warn', 1200);
      } else if (type === 'ok') {
        beepScan(1); flash('#16a34a', 250); setCamStatus('✅ Berhasil', 'ok', 1000);
      } else if (type === 'nf') {
        beep(false); flash('#dc2626', 400); setCamStatus('❌ Terbaca, tapi TIDAK ADA di data', 'err', 2200);
      } else {
        beep(false); flash('#dc2626', 400); setCamStatus('⚠ Error koneksi/server (bukan salah baca)', 'err', 2500);
      }
    }

    async function doScan(code) {
      code = cleanBarcode(code);
      if (!code) return;
      const resultEl = document.getElementById('scanResult');

      // ---- Jalur cepat: data lokal (wajibTurun juga sudah ikut dari server) -> seketika ----
      const item = itemIndex.get(code.toUpperCase());
      if (item) {
        const already = item.mark === 1;
        if (!already) { item.mark = 1; queueSync(item.noFaktur); }
        const type = item.wajibTurun ? 'turun' : (already ? 'dup' : 'ok');
        signalScan(type);
        addLog(code, type, item.wajibTurun ? 'WAJIB TURUN' : (already ? 'sudah' : 'ok'));
        renderResult(item, already);
        refreshStats();
        afterScanUi();
        return;
      }

      // ---- Tidak ada di lokal -> tanya server ----
      beepScan(1);
      setCamStatus('Mencari ' + code + '...', '', 1500);
      resultEl.innerHTML = '<div style="text-align:center;padding:12px;color:var(--muted)">Mencari...</div>';
      try {
        const data = await api('scan', { nf: code });
        if (!data.found) {
          signalScan('nf');
          addLog(code, 'nf', 'tidak ada di data');
          resultEl.innerHTML = `
            <div class="result-box error">
              <div class="title">❌ Tidak Ditemukan</div>
              <div class="detail">No Faktur: <strong>${esc(code)}</strong></div>
              <div class="detail">Kode terbaca normal, tapi tidak ada di sheet.</div>
            </div>`;
          afterScanUi();
          return;
        }
        const idx = items.findIndex(i => i.noFaktur === data.noFaktur);
        if (idx >= 0) { items[idx].mark = 1; items[idx].wajibTurun = !!data.wajibTurun; }
        const type = data.wajibTurun ? 'turun' : (data.alreadyMarked ? 'dup' : 'ok');
        signalScan(type);
        addLog(code, type, data.wajibTurun ? 'WAJIB TURUN' : (data.alreadyMarked ? 'sudah' : 'ok'));
        renderResult(data, data.alreadyMarked);
        refreshStats();
        afterScanUi();
      } catch (e) {
        signalScan('err');
        addLog(code, 'err', 'gagal kirim');
        resultEl.innerHTML = `<div class="result-box error"><div class="title">⚠ Error Koneksi</div><div class="detail">${esc(e.message)}<br>Bukan salah baca — scan ulang / ketik manual.</div></div>`;
      }
    }

    function playTurunSound() {
      speak('Turun');
      try { if (navigator.vibrate) navigator.vibrate([200, 80, 200]); } catch (e) {}
    }

    function keepCameraAlive() {
      if (isScanning && videoEl && videoEl.paused) videoEl.play().catch(() => {});
    }

    // Satu AudioContext saja, dipakai ulang (tidak dibuat/ditutup tiap scan)
    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function speak(text) {
      try {
        if (!window.speechSynthesis) return;
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'id-ID';
        u.rate = 1.1;
        u.pitch = 1.15;
        u.volume = 1.0;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    // Panaskan mesin suara supaya "Turun" tidak telat pada pemakaian pertama
    function warmSpeech() {
      try {
        if (!window.speechSynthesis) return;
        speechSynthesis.getVoices();
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    // "Tit" khas mesin scanner (n kali)
    function beepScan(times = 1) {
      try {
        const ctx = getCtx();
        const t0 = ctx.currentTime;
        for (let k = 0; k < times; k++) {
          const t = t0 + k * 0.12;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'square';
          osc.frequency.value = 2000;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.25, t + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        }
      } catch (e) {}
    }

    function beep(success) {
      if (success) { beepScan(1); return; }
      try {
        const ctx = getCtx();
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 300;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
      } catch (e) {}
    }

    function alarmBeep() {
      try {
        const ctx = getCtx();
        let t = ctx.currentTime;
        // Bunyi alarm singkat, bareng ucapan "Turun"
        for (let i = 0; i < 2; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'square';
          osc.frequency.value = i % 2 === 0 ? 880 : 620;
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.22);
          t += 0.25;
        }
      } catch (e) {}
    }

    // ================== SCANNER ==================
    // Pakai pembaca bawaan HP (BarcodeDetector) kalau ada = sangat cepat; kalau tidak, ZXing.
    async function initDetector() {
      if (detector || zxReader) return;
      if ('BarcodeDetector' in window) {
        try {
          const sup = await BarcodeDetector.getSupportedFormats();
          const f = ['code_39', 'code_93', 'code_128', 'codabar', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'qr_code', 'data_matrix'].filter(x => sup.includes(x));
          if (f.length) { detector = new BarcodeDetector({ formats: f }); return; }
        } catch (e) {}
      }
      if (window.ZXing) {
        const F = ZXing.BarcodeFormat;
        const mk = hard => {
          const hints = new Map();
          hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.CODE_39, F.CODE_93, F.CODE_128, F.CODABAR, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.QR_CODE, F.DATA_MATRIX]);
          if (hard) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
          const r = new ZXing.MultiFormatReader();
          r.setHints(hints);
          return r;
        };
        zxReader = mk(false);   // cepat (tiap frame)
        zxHard = mk(true);      // teliti (tiap frame ke-3)
      }
    }

    function decodeZx(v) {
      const w = Math.min(v.videoWidth, 720), h = Math.round(v.videoHeight * w / v.videoWidth);
      if (!zxCanvas) zxCanvas = document.createElement('canvas');
      zxCanvas.width = w; zxCanvas.height = h;
      zxCanvas.getContext('2d', { willReadFrequently: true }).drawImage(v, 0, 0, w, h);
      try {
        const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(zxCanvas)));
        return ((++zxN % 3 === 0) ? zxHard : zxReader).decodeWithState(bmp).getText();
      } catch (e) { return null; }
    }

    // Coba resolusi tinggi dulu, kalau gagal turun bertahap sampai kamera pasti terbuka
    async function openStream() {
      const tries = [
        { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: { facingMode: 'environment' }, audio: false },
        { video: true, audio: false }
      ];
      let lastErr;
      for (const c of tries) {
        try { return await navigator.mediaDevices.getUserMedia(c); }
        catch (e) { lastErr = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') break; }
      }
      throw lastErr;
    }

    function setBtn(on, busyText) {
      const btn = document.getElementById('btnStartScan');
      btn.disabled = !!busyText;
      btn.textContent = busyText || (on ? '⏹ Stop Kamera' : 'Mulai Kamera');
      btn.classList.toggle('btn-danger', !!on && !busyText);
      btn.classList.toggle('btn-primary', !on || !!busyText);
    }

    function camErrorText(e) {
      const n = e && e.name;
      if (n === 'NotAllowedError' || n === 'SecurityError') return 'Izin kamera ditolak — aktifkan di pengaturan browser';
      if (n === 'NotFoundError') return 'Kamera tidak ditemukan';
      if (n === 'NotReadableError') return 'Kamera dipakai aplikasi lain — tutup dulu';
      return (e && e.message) || 'Kamera gagal dibuka';
    }

    async function toggleScan() {
      if (isScanning) stopScan();
      else { window.__camRetried = false; startScan(); }
    }

    async function startScan() {
      if (isScanning || camBusy) return;
      getCtx(); warmSpeech();
      if (!BACKEND_URL) { toast('Isi URL backend dulu di Home', 'error'); return; }
      camBusy = true;
      setBtn(false, 'Membuka kamera...');
      setCamStatus('Membuka kamera...', '');
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Kamera butuh HTTPS — buka lewat link https');
        await initDetector();
        if (!detector && !zxReader) throw new Error('Pembaca barcode gagal dimuat — cek internet lalu refresh');
        stream = await openStream();
        videoEl = document.getElementById('cam');
        videoEl.srcObject = stream;
        await videoEl.play();
        try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
        try {
          const caps = stream.getVideoTracks()[0].getCapabilities ? stream.getVideoTracks()[0].getCapabilities() : {};
          document.getElementById('btnTorch').classList.toggle('hidden', !caps.torch);
        } catch (e) {}
        isScanning = true;
        lastDecodeAt = Date.now();
        setBtn(true);
        setCamStatus(IDLE_OK, '');
        scanLoop(++loopGen);
        // Kalau 2.5 detik belum ada gambar, buka ulang sekali
        setTimeout(() => {
          if (isScanning && videoEl && !videoEl.videoWidth && !window.__camRetried) {
            window.__camRetried = true;
            stopScan().then(startScan);
          }
        }, 2500);
      } catch (err) {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        isScanning = false;
        setBtn(false);
        setCamStatus('❌ ' + camErrorText(err), 'err');
        toast(camErrorText(err), 'error');
      } finally {
        camBusy = false;
      }
    }

    async function scanLoop(gen) {
      if (!isScanning || gen !== loopGen) return;
      const v = videoEl;
      if (v && v.readyState >= 2 && v.videoWidth) {
        try {
          let code = null, seenButEmpty = false;
          if (detector) {
            const r = await detector.detect(v);
            const hit = r.find(x => x.rawValue);
            if (hit) code = hit.rawValue; else if (r.length) seenButEmpty = true;
          } else {
            code = decodeZx(v);
          }
          if (code) handleDecoded(code);
          else if (seenButEmpty) setCamStatus('⚠ Kode terdeteksi tapi isinya tidak terbaca — dekatkan / tahan stabil', 'warn', 800);
          else idleStatus();
        } catch (e) {}
      }
      if (isScanning && gen === loopGen) {
        if (v && v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => scanLoop(gen));
        else loopTimer = setTimeout(() => scanLoop(gen), detector ? 10 : 30);
      }
    }

    function toggleTorch() {
      if (!stream) return;
      torchOn = !torchOn;
      stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => { torchOn = false; });
    }

    function handleDecoded(raw) {
      const c = cleanBarcode(raw);
      if (!c) { setCamStatus('⚠ Kode terbaca tapi kosong', 'warn', 800); return; }
      const now = Date.now();
      lastDecodeAt = now;
      // kode yang sama ditahan 2 detik (anti dobel), kode beda langsung diproses
      if (c === lastScanned && now - lastScanTime < 2000) return;
      lastScanned = c;
      lastScanTime = now;
      doScan(c);
    }

    async function stopScan() {
      isScanning = false;
      loopGen++;
      clearTimeout(loopTimer);
      torchOn = false;
      document.getElementById('btnTorch').classList.add('hidden');
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (videoEl) videoEl.srcObject = null;
      setBtn(false);
      setCamStatus('Kamera mati', '');
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.filter === f);
      });
      renderList();
    }

    function renderList() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      let list = items;

      if (currentFilter === 'marked') list = list.filter(i => i.mark === 1);
      if (currentFilter === 'unmarked') list = list.filter(i => i.mark !== 1);
      if (currentFilter === 'turun') list = list.filter(i => i.wajibTurun);
      if (currentKode !== 'all') list = list.filter(i => i.kode === currentKode);

      if (q) {
        list = list.filter(i => {
          const s = [i.noFaktur, i.kode, i.jenis, i.merk, i.tipe, i.imei, i.noPolisi].join(' ').toLowerCase();
          return s.includes(q);
        });
      }

      const el = document.getElementById('itemList');
      if (list.length === 0) {
        el.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted)">Tidak ada data</div>';
        return;
      }

      el.innerHTML = `<div class="count">${list.length} data</div>` + list.slice(0, 250).map(i => {
        const name = [i.jenis, i.merk, i.tipe].filter(Boolean).join(' • ') || 'Tanpa Nama';
        const kc = KODES.includes(i.kode) ? 'k-' + i.kode : '';
        return `
          <div class="item ${kc} ${i.mark === 1 ? 'marked' : ''} ${i.wajibTurun ? 'wajib' : ''}">
            <div class="check">${i.mark === 1 ? '✓' : ''}</div>
            <div class="info">
              <div class="top"><span class="tag">${esc(i.kode || '-')}</span><span class="nf">${esc(i.noFaktur)}</span>${i.wajibTurun ? '<span class="badge-turun">TURUN</span>' : ''}</div>
              <div class="name">${esc(name)}</div>
              <div class="meta">${i.imei ? 'IMEI: ' + esc(i.imei) : (i.noPolisi ? 'Polisi: ' + esc(i.noPolisi) : '')}</div>
            </div>
          </div>`;
      }).join('');
    }

    async function resetMarks() {
      if (!confirm('Reset SEMUA Mark jadi kosong?')) return;
      try {
        const data = await api('reset');
        if (data.ok) {
          items.forEach(i => i.mark = 0);
          updateStats({ total: items.length, marked: 0, wajibTurunCount: items.filter(i => i.wajibTurun).length });
          renderList();
          toast('Semua Mark di-reset', 'success');
        }
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.page === page);
      });
      if (page !== 'scan' && isScanning) stopScan();
      if (page === 'list') renderList();
      if (page === 'scan') startScan();   // kamera otomatis nyala
    }

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2800);
    }
  </script>
</body>
</html>
